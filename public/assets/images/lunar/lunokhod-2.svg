<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02050d" />
      <stop offset="62%" stop-color="#091224" />
      <stop offset="100%" stop-color="#172033" />
    </linearGradient>
    <linearGradient id="regolithGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="45%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="metalSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
  </defs>

  <!-- Deep Space Starfield -->
  <rect width="800" height="500" fill="url(#skyGrad)" />
  <g fill="#e2e8f0" opacity="0.65">
    <circle cx="85" cy="54" r="1.4" /><circle cx="165" cy="92" r="1" /><circle cx="260" cy="38" r="1.6" />
    <circle cx="380" cy="64" r="1.1" /><circle cx="510" cy="44" r="1.5" /><circle cx="645" cy="78" r="1.8" />
    <circle cx="735" cy="48" r="1.2" /><circle cx="120" cy="145" r="1.2" /><circle cx="690" cy="142" r="1.4" />
  </g>

  <!-- Distant Earth or Lunar Horizon Rim -->
  <circle cx="675" cy="98" r="26" fill="#1d4ed8" opacity="0.85" />
  <path d="M660,84 Q678,92 688,108" fill="none" stroke="#93c5fd" stroke-width="5" opacity="0.65" />

  <!-- Lunar Cratered Horizon & Regolith Surface -->
  <path d="M0,295 Q160,262 330,285 T660,272 L800,288 L800,500 L0,500 Z" fill="url(#regolithGrad)" />
  <ellipse cx="145" cy="348" rx="68" ry="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" opacity="0.65" />
  <ellipse cx="655" cy="362" rx="82" ry="16" fill="#0f172a" stroke="#475569" stroke-width="1.5" opacity="0.65" />

  <!-- Telemetry Grid Overlay -->
  <g stroke="#60a5fa" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  
      <!-- Lunokhod 8-Wheeled Tub Chassis + Hinged Solar Clamshell Lid + Helical/Conical Antennas -->
      <g transform="translate(400, 248)">
        <ellipse cx="0" cy="68" rx="155" ry="20" fill="#030712" opacity="0.75" />
        <!-- Hinged Open Solar Lid -->
        <ellipse cx="-82" cy="-58" rx="68" ry="26" transform="rotate(-28 -82 -58)" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2.5" />
        <line x1="-125" y1="-38" x2="-40" y2="-78" stroke="#60a5fa" stroke-width="1" opacity="0.6" />
        <line x1="-110" y1="-28" x2="-28" y2="-68" stroke="#60a5fa" stroke-width="1" opacity="0.6" />
        <!-- Pressurized Tub Body -->
        <path d="M-78,-18 L78,-18 L62,32 L-62,32 Z" fill="url(#metalSphere)" stroke="#e2e8f0" stroke-width="2" />
        <!-- Stereo TV Cameras (Lunokhod 2 has elevated 3rd navigational camera) -->
        <circle cx="52" cy="-4" r="11" fill="#0f172a" stroke="#60a5fa" stroke-width="2.2" />
        <circle cx="24" cy="-4" r="11" fill="#0f172a" stroke="#60a5fa" stroke-width="2.2" />
        <rect x="30" y="-44" width="26" height="18" rx="4" fill="#e2e8f0" stroke="#60a5fa" stroke-width="2" /><circle cx="43" cy="-35" r="6" fill="#0f172a" />
        <!-- Directional Helical Antenna + Laser Retroreflector -->
        <line x1="10" y1="-18" x2="48" y2="-76" stroke="#cbd5e1" stroke-width="4" />
        <polygon points="48,-76 68,-92 38,-96" fill="#60a5fa" />
        <rect x="65" y="4" width="32" height="12" transform="rotate(-12 65 4)" fill="#38bdf8" stroke="#e2e8f0" stroke-width="1.5" />
        <!-- 4 Visible Mesh Spoked Wheels (8 total) -->
        
          <g transform="translate(-64, 46)">
            <circle cx="0" cy="0" r="21" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" />
            <circle cx="0" cy="0" r="8" fill="#94a3b8" />
            <line x1="-18" y1="0" x2="18" y2="0" stroke="#64748b" stroke-width="1.4" />
            <line x1="0" y1="-18" x2="0" y2="18" stroke="#64748b" stroke-width="1.4" />
            <line x1="-13" y1="-13" x2="13" y2="13" stroke="#64748b" stroke-width="1.4" />
            <line x1="-13" y1="13" x2="13" y2="-13" stroke="#64748b" stroke-width="1.4" />
          </g>
          <g transform="translate(-22, 46)">
            <circle cx="0" cy="0" r="21" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" />
            <circle cx="0" cy="0" r="8" fill="#94a3b8" />
            <line x1="-18" y1="0" x2="18" y2="0" stroke="#64748b" stroke-width="1.4" />
            <line x1="0" y1="-18" x2="0" y2="18" stroke="#64748b" stroke-width="1.4" />
            <line x1="-13" y1="-13" x2="13" y2="13" stroke="#64748b" stroke-width="1.4" />
            <line x1="-13" y1="13" x2="13" y2="-13" stroke="#64748b" stroke-width="1.4" />
          </g>
          <g transform="translate(22, 46)">
            <circle cx="0" cy="0" r="21" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" />
            <circle cx="0" cy="0" r="8" fill="#94a3b8" />
            <line x1="-18" y1="0" x2="18" y2="0" stroke="#64748b" stroke-width="1.4" />
            <line x1="0" y1="-18" x2="0" y2="18" stroke="#64748b" stroke-width="1.4" />
            <line x1="-13" y1="-13" x2="13" y2="13" stroke="#64748b" stroke-width="1.4" />
            <line x1="-13" y1="13" x2="13" y2="-13" stroke="#64748b" stroke-width="1.4" />
          </g>
          <g transform="translate(64, 46)">
            <circle cx="0" cy="0" r="21" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" />
            <circle cx="0" cy="0" r="8" fill="#94a3b8" />
            <line x1="-18" y1="0" x2="18" y2="0" stroke="#64748b" stroke-width="1.4" />
            <line x1="0" y1="-18" x2="0" y2="18" stroke="#64748b" stroke-width="1.4" />
            <line x1="-13" y1="-13" x2="13" y2="13" stroke="#64748b" stroke-width="1.4" />
            <line x1="-13" y1="13" x2="13" y2="-13" stroke="#64748b" stroke-width="1.4" />
          </g>
      </g>
    

  <!-- Top Telemetry Header Bar -->
  <rect x="24" y="20" width="752" height="44" rx="8" fill="#050b16" fill-opacity="0.78" stroke="#60a5fa" stroke-opacity="0.45" />
  <text x="42" y="47" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">LUNOKHOD 2 · LUNA 21 (8E22)</text>
  <text x="756" y="47" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1.5">TEKNİK REKONSTRÜKSİYON ŞEMASI</text>

  <!-- Bottom Telemetry Footer Plate -->
  <rect x="24" y="412" width="752" height="66" rx="8" fill="#050b16" fill-opacity="0.86" stroke="#334155" />
  <text x="42" y="439" fill="#f8fafc" font-family="sans-serif" font-size="17" font-weight="bold" letter-spacing="1.5">LUNOKHOD 2 LONG-RANGE ROVER</text>
  <text x="42" y="463" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="1">LE MONNIER KRATERİ · 25.85°N, 30.45°E</text>
  <text x="756" y="463" fill="#60a5fa" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end" letter-spacing="1">15 OCAK 1973 · 39 KM AY YÜZEY REKORU</text>
</svg>