<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02050d" />
      <stop offset="62%" stop-color="#091224" />
      <stop offset="100%" stop-color="#172033" />
    </linearGradient>
    <linearGradient id="regolithGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="45%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="metalSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
  </defs>

  <!-- Deep Space Starfield -->
  <rect width="800" height="500" fill="url(#skyGrad)" />
  <g fill="#e2e8f0" opacity="0.65">
    <circle cx="85" cy="54" r="1.4" /><circle cx="165" cy="92" r="1" /><circle cx="260" cy="38" r="1.6" />
    <circle cx="380" cy="64" r="1.1" /><circle cx="510" cy="44" r="1.5" /><circle cx="645" cy="78" r="1.8" />
    <circle cx="735" cy="48" r="1.2" /><circle cx="120" cy="145" r="1.2" /><circle cx="690" cy="142" r="1.4" />
  </g>

  <!-- Distant Earth or Lunar Horizon Rim -->
  <circle cx="675" cy="98" r="26" fill="#1d4ed8" opacity="0.85" />
  <path d="M660,84 Q678,92 688,108" fill="none" stroke="#93c5fd" stroke-width="5" opacity="0.65" />

  <!-- Lunar Cratered Horizon & Regolith Surface -->
  <path d="M0,295 Q160,262 330,285 T660,272 L800,288 L800,500 L0,500 Z" fill="url(#regolithGrad)" />
  <ellipse cx="145" cy="348" rx="68" ry="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" opacity="0.65" />
  <ellipse cx="655" cy="362" rx="82" ry="16" fill="#0f172a" stroke="#475569" stroke-width="1.5" opacity="0.65" />

  <!-- Telemetry Grid Overlay -->
  <g stroke="#fb923c" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  
      <!-- Apollo Lunar Roving Vehicle (LRV): Wire-Mesh Wheels, Folding Lawn-Chair Seats, High-Gain Dish Umbrella Antenna -->
      <g transform="translate(400, 252)">
        <ellipse cx="0" cy="66" rx="165" ry="20" fill="#030712" opacity="0.75" />
        <!-- Chassis Frame -->
        <rect x="-105" y="18" width="210" height="12" rx="4" fill="#cbd5e1" stroke="#fb923c" stroke-width="2" />
        <!-- Two Astronaut Seats + T-Controller -->
        <path d="M-28,18 L-28,-22 L-8,-22 M12,18 L12,-22 L32,-22" fill="none" stroke="#f8fafc" stroke-width="4" />
        <line x1="38" y1="18" x2="52" y2="-14" stroke="#fb923c" stroke-width="3" />
        <!-- Forward LCRU + Color TV Camera + S-Band Umbrella High-Gain Dish Antenna -->
        <rect x="64" y="-4" width="32" height="22" rx="3" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.5" />
        <line x1="58" y1="18" x2="58" y2="-68" stroke="#e2e8f0" stroke-width="3" />
        <!-- Parabolic Mesh Dish -->
        <path d="M22,-88 Q58,-48 94,-88" fill="none" stroke="#fb923c" stroke-width="3.5" />
        <line x1="58" y1="-68" x2="58" y2="-94" stroke="#f8fafc" stroke-width="2" />
        <!-- Fenders & 4 Woven Zinc-Coated Piano-Wire Wheels with Titanium Chevrons -->
        <path d="M-118,22 Q-82,-2 -46,22" fill="none" stroke="#d97706" stroke-width="4" />
        <path d="M46,22 Q82,-2 118,22" fill="none" stroke="#d97706" stroke-width="4" />
        
          <g transform="translate(-82, 42)">
            <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 3" />
            <circle cx="0" cy="0" r="12" fill="#f59e0b" stroke="#fff" stroke-width="1.5" />
            <line x1="-24" y1="0" x2="24" y2="0" stroke="#94a3b8" stroke-width="1.2" />
            <line x1="0" y1="-24" x2="0" y2="24" stroke="#94a3b8" stroke-width="1.2" />
          </g>
          <g transform="translate(82, 42)">
            <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 3" />
            <circle cx="0" cy="0" r="12" fill="#f59e0b" stroke="#fff" stroke-width="1.5" />
            <line x1="-24" y1="0" x2="24" y2="0" stroke="#94a3b8" stroke-width="1.2" />
            <line x1="0" y1="-24" x2="0" y2="24" stroke="#94a3b8" stroke-width="1.2" />
          </g>
      </g>
    

  <!-- Top Telemetry Header Bar -->
  <rect x="24" y="20" width="752" height="44" rx="8" fill="#050b16" fill-opacity="0.78" stroke="#fb923c" stroke-opacity="0.45" />
  <text x="42" y="47" fill="#fb923c" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">APOLLO 15 · LRV-001</text>
  <text x="756" y="47" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1.5">TEKNİK REKONSTRÜKSİYON ŞEMASI</text>

  <!-- Bottom Telemetry Footer Plate -->
  <rect x="24" y="412" width="752" height="66" rx="8" fill="#050b16" fill-opacity="0.86" stroke="#334155" />
  <text x="42" y="439" fill="#f8fafc" font-family="sans-serif" font-size="17" font-weight="bold" letter-spacing="1.5">APOLLO 15 LUNAR ROVING VEHICLE</text>
  <text x="42" y="463" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="1">HADLEY–APENNINE · 26.13°N, 3.63°E</text>
  <text x="756" y="463" fill="#fb923c" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end" letter-spacing="1">31 TEMMUZ 1971 · İLK MÜRETTEBATLI AY ARABASI</text>
</svg>